<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="dark" />
    <title>Scarab Verify — settings</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="options">
    <header><h1>Scarab Verify — sites to check</h1></header>
    <main>
      <p class="muted">
        On each of these sites the extension records what the page loads, re-fetches each file as you, and compares the hashes with
        the manifest attached to the release the site says it serves.
      </p>
      <ul id="origins"></ul>
      <form id="add">
        <label>Self-hosted Scarab <input id="origin" type="url" placeholder="https://scarab.example" required /></label>
        <label>
          Attested manifests (optional)
          <input id="manifest" type="text" placeholder="https://releases.example/{tag}/build.json" />
          <small class="muted">Leave empty for the GitHub release of the repository the site names. <code>{tag}</code> is the release tag.</small>
        </label>
        <button type="submit">Add</button>
      </form>
      <p id="status"></p>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
