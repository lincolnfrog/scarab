name: Release

# The trust chain for scarab.one (PRIVACY.md, "The trust root: served JavaScript").
#
# Every push to main, and every pull request against it, is a dry run of a
# release. The app is built twice, on two runners, and the run fails unless
# both manifests (dist/build.json — scripts/build-manifest.mjs: the sha256 of
# every served file, the commit, the tag) are byte-identical. The Docker image
# is then built from the Dockerfile (base images pinned by digest) and the run
# fails unless the manifest inside the image is that same file. Nothing is
# pushed or signed.
#
# A v* tag does all of that, then pushes the image to Artifact Registry
# through Workload Identity Federation (no key anywhere: scripts/bootstrap-gcp.sh
# sets it up, and the service account may only push images), signs SLSA
# provenance for the image digest and for build.json with Sigstore
# (actions/attest-build-provenance), checks both with `gh attestation verify`,
# and publishes a GitHub release with build.json attached. Deploying stays a
# human act: `./scripts/deploy.sh vX.Y.Z` verifies the image's attestation and
# deploys that digest; scripts/verify-served.sh lets anyone on the allowlist
# check that what scarab.one serves is the manifest of that release.
#
# Repository variables (Settings → Secrets and variables → Actions → Variables;
# none of them is a secret; bootstrap-gcp.sh prints them):
#   GCP_PROJECT_ID, GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT
# Actions are pinned to commits (the comment is the tag) for the same reason
# the Dockerfile pins digests.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions: {}

env:
  NODE_VERSION: '22'
  # Provenance written into dist/build.json — the same values on every runner
  # and inside the Docker build, so all three manifests can be compared.
  SCARAB_COMMIT: ${{ github.sha }}
  SCARAB_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
  SCARAB_REPO: ${{ github.server_url }}/${{ github.repository }}

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: Build (copy ${{ matrix.copy }})
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest-${{ matrix.copy }}
          path: dist/build.json
          if-no-files-found: error

  reproducible:
    name: Two builds, one manifest
    needs: build
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest-1
          path: one
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest-2
          path: two
      - name: The two runners built byte-identical manifests
        run: |
          if ! cmp one/build.json two/build.json; then
            echo '::error::The two builds differ — the build is not reproducible. Diff:'
            diff one/build.json two/build.json || true
            exit 1
          fi
          echo "Reproducible: $(jq '.assets | length' one/build.json) files, commit $(jq -r .commit one/build.json)"
          cat one/build.json

  image:
    name: Image${{ github.ref_type == 'tag' && ', attestations and release' || ' (dry run)' }}
    needs: [check, reproducible]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release (tags only)
      id-token: write # Workload Identity Federation and Sigstore signing (tags only)
      attestations: write
    env:
      IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/scarab/scarab
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest-1
          path: expected
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image from the Dockerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: scarab:ci
          provenance: false
          sbom: false
          build-args: |
            SCARAB_COMMIT=${{ env.SCARAB_COMMIT }}
            SCARAB_TAG=${{ env.SCARAB_TAG }}
            SCARAB_REPO=${{ env.SCARAB_REPO }}

      - name: The image serves the manifest the runners built
        run: |
          id=$(docker create scarab:ci)
          docker cp "$id:/app/dist/build.json" image-build.json
          docker rm "$id" >/dev/null
          if ! cmp expected/build.json image-build.json; then
            echo '::error::The Docker build produced a different manifest than the runner build. Diff:'
            diff expected/build.json image-build.json || true
            exit 1
          fi
          echo "The image's dist/ is the attested manifest."

      - name: The four repository variables are set (Settings → Secrets and variables → Actions → Variables)
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          WIF_PROVIDER: ${{ vars.WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          IS_TAG: ${{ github.ref_type == 'tag' }}
        run: |
          missing=""
          for v in GCP_PROJECT_ID GCP_REGION WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            [[ -n "${!v}" ]] || missing="$missing $v"
          done
          if [[ -z "$missing" ]]; then
            echo "Release configuration: $GCP_PROJECT_ID / $GCP_REGION, $WIF_SERVICE_ACCOUNT through $WIF_PROVIDER"
            exit 0
          fi
          msg="repository variable(s) not set:$missing. They are Variables, not Secrets — Settings → Secrets and variables → Actions → Variables → Repository variables (scripts/bootstrap-gcp.sh trust-chain prints the values)."
          if [[ "$IS_TAG" == "true" ]]; then echo "::error::$msg"; exit 1; fi
          echo "::warning::$msg A tag build would stop here."

      # ---- tags only from here: push, attest, verify, release ----

      - name: Sign in to Google Cloud (Workload Identity Federation)
        if: github.ref_type == 'tag'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        if: github.ref_type == 'tag'
      - name: Push the image
        id: push
        if: github.ref_type == 'tag'
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker tag scarab:ci "$IMAGE:$SCARAB_TAG"
          docker tag scarab:ci "$IMAGE:sha-${SCARAB_COMMIT:0:12}"
          docker push "$IMAGE:$SCARAB_TAG"
          docker push "$IMAGE:sha-${SCARAB_COMMIT:0:12}"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$SCARAB_TAG" | grep "^$IMAGE@" | head -1 | cut -d@ -f2)
          [[ "$digest" == sha256:* ]] || { echo '::error::could not read the pushed digest'; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE@$digest"

      - name: Attest the image
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: false
      - name: Attest the manifest
        if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: expected/build.json

      - name: Verify both attestations the way a deployer or a third party will
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          verify() { # <subject> — verifies the signature, and that it was built from this tag at this commit by this workflow
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --format json > verify.json
            ref=$(jq -r '.[0].verificationResult.statement.predicate.buildDefinition.externalParameters.workflow.ref' verify.json)
            commit=$(jq -r '.[0].verificationResult.statement.predicate.buildDefinition.resolvedDependencies[0].digest.gitCommit' verify.json)
            [[ "$ref" == "refs/tags/$SCARAB_TAG" && "$commit" == "$SCARAB_COMMIT" ]] \
              || { echo "::error::$1 is attested for $ref @ $commit, not refs/tags/$SCARAB_TAG @ $SCARAB_COMMIT"; exit 1; }
            echo "verified: $1 ← $ref @ ${commit:0:7}"
          }
          verify expected/build.json
          verify "oci://$IMAGE@${{ steps.push.outputs.digest }}"

      - name: Publish the release with build.json attached
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          cat > notes.md <<NOTES
          Built from \`$SCARAB_COMMIT\` by this workflow; two independent builds produced this manifest.

          **Image** \`$IMAGE@${{ steps.push.outputs.digest }}\`
          **Manifest** \`build.json\` (attached): $(jq '.assets | length' expected/build.json) files, \`index.html\` sha256 \`$(jq -r '.assets["index.html"]' expected/build.json)\`

          Deploy: \`./scripts/deploy.sh $SCARAB_TAG\` (verifies the image's attestation, then deploys that digest).

          Verify what scarab.one serves against this release: \`scripts/verify-served.sh --tag $SCARAB_TAG\`, or by hand:
          \`\`\`
          gh attestation verify build.json --repo $GITHUB_REPOSITORY
          gh attestation verify oci://$IMAGE@${{ steps.push.outputs.digest }} --repo $GITHUB_REPOSITORY
          \`\`\`
          NOTES
          gh release create "$SCARAB_TAG" expected/build.json --verify-tag --title "$SCARAB_TAG" --notes-file notes.md
