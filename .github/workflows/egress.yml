# The runnable form of PRIVACY.md's zero-knowledge claim: a real build, the real
# vault-only server, headless Chromium with a virtual passkey, and every request
# the tab makes recorded and judged (e2e/egress.spec.ts). Its own workflow, so a
# failure here reads as what it is — plaintext leaving the tab — and so the
# browser download is cached apart from everything else.
name: egress

on:
  push:
  pull_request:

# Actions are pinned to commits (the comment is the tag), as in release.yml.
permissions:
  contents: read

concurrency:
  group: egress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  egress:
    name: zero-knowledge session sends only ciphertext
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Playwright browser, keyed on the Playwright version the lockfile pins.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Chromium's system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Builds dist/ and dist-server/, starts the vault-only server, drives the session.
      - run: npm run test:egress

      - name: Keep the trace and the request log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: egress-failure
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
